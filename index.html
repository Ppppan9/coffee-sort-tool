<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>咖啡分拣核玩工具</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1b1d22;color:#ddd;font:13px/1.4 "Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
#app{display:flex;height:100vh;gap:14px;padding:10px}
#stageWrap{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;position:relative}
#stage{height:calc(100vh - 20px);max-width:100%;aspect-ratio:9/16;background:#000;box-shadow:0 6px 30px rgba(0,0,0,.6);border-radius:6px;cursor:pointer;touch-action:none}
#panel{width:420px;flex:none;display:flex;flex-direction:column;background:#24272e;border-radius:8px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.4)}
#panelHead{padding:10px 12px;border-bottom:1px solid #333;background:#2b2f37}
#panelHead h1{font-size:15px;margin:0 0 8px;color:#ffd54a}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns button{flex:1 1 30%}
button{background:#3a404c;color:#eee;border:1px solid #4b5260;border-radius:5px;padding:6px 8px;cursor:pointer;font:inherit;white-space:nowrap}
button:hover{background:#465060}
button.primary{background:#2e8b47;border-color:#3aa957}
button.on{background:#b33a3a;border-color:#d55}
#status{margin-top:8px;color:#9fd;font-size:12px}
#recInfo{color:#f99;font-size:12px;margin-top:4px}
#recList a{display:block;color:#8cf;font-size:12px;margin-top:3px;word-break:break-all}
#panelBody{overflow-y:auto;flex:1;padding:6px 10px 30px}
details{border:1px solid #353a44;border-radius:6px;margin:8px 0;background:#2a2e36}
summary{cursor:pointer;padding:8px 10px;font-weight:bold;color:#ffd98a;user-select:none}
.row{display:flex;align-items:center;gap:6px;padding:4px 10px}
.row label{flex:0 0 150px;color:#c8ccd4;font-size:12px}
.row input[type=range]{flex:1;min-width:60px}
.row input.val{width:64px;background:#1d2026;color:#fff;border:1px solid #444;border-radius:4px;padding:2px 4px}
.row input[type=text],.row input[type=number]:not(.val),.row select,.row textarea{flex:1;min-width:0;background:#1d2026;color:#fff;border:1px solid #444;border-radius:4px;padding:3px 5px;font:inherit}
.row input[type=color]{width:46px;height:24px;border:none;background:none;padding:0}
.row input[type=file]{flex:1;min-width:0;font-size:11px}
.row button{padding:3px 8px}
.handprev{align-items:flex-start}
#handPrev{border-radius:4px;cursor:crosshair;width:150px;height:190px}
#toast{position:absolute;top:18px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
#migrateBanner{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:50;max-width:min(860px,94vw);background:#fff8e1;color:#4a3000;border:1px solid #e0b84a;border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.6;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#migrateBanner button{margin-left:8px;padding:3px 10px;border-radius:6px;border:1px solid #c79a2a;background:#ffe69a;cursor:pointer}
#migrateBanner button#mbReset{background:#4caf50;color:#fff;border-color:#2e7d32}

.row.t-switch label{flex:1}
.switch{position:relative;display:inline-block;width:46px;height:28px;flex:none;cursor:pointer}
.switch .switch-input{opacity:0;width:0;height:0;position:absolute}
.switch .slider{position:absolute;inset:0;background:#555;border-radius:28px;transition:background .2s}
.switch .slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.switch .switch-input:checked+.slider{background:#34c759}
.switch .switch-input:checked+.slider:before{transform:translateX(18px)}
.switch .switch-input:focus-visible+.slider{outline:2px solid #8cf;outline-offset:2px}
.row.dimmed{opacity:.45;pointer-events:none}
.tip{font-size:11px;color:#888;padding:6px 10px}
</style>
</head>
<body>
<div id="app">
  <div id="stageWrap"><canvas id="stage" width="720" height="1280"></canvas><div id="toast"></div></div>
  <div id="panel">
    <div id="panelHead">
      <h1>🔩 咖啡分拣核玩工具 · 控制面板</h1>
      <div class="btns">
        <button id="btnAuto" class="primary">▶ 自动通关</button>
        <button id="btnRec">⏺ 开始录制</button>
        <button id="btnNew">↻ 重新开始</button>
        <button id="btnSeed">🎲 换一局</button>
        <button id="btnShape">🖼 导入图形关卡</button>
        <button id="btnShot">📷 截图</button>
        <button id="btnExport">导出设置</button>
        <button id="btnImport">导入设置</button>
        <button id="btnReset">恢复默认</button>
      </div>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <div id="status"></div>
      <div id="recInfo"></div>
      <div id="recList"></div>
    </div>
    <div id="panelBody"></div>
  </div>
</div>

v1.2\uFF1A3D \u6A21\u578B\u4FDD\u7559 PBR \u6750\u8D28 + \u592A\u9633\u5149/\u73AF\u5883\u5149\uFF08\u4E0E\u9875\u9762 three.js \u4E00\u81F4\uFF09\uFF0C2D \u53E0\u52A0\u5C42\uFF08mat_*\uFF09\u6539\u4E3A\u201C\u81EA\u53D1\u5149 + \u900F\u660E\u201D\u2192 scene3d.json \u91CC\u7684\u6DE1\u5165\u6DE1\u51FA\u66F2\u7EBF\u70D8\u5230\u6750\u8D28 Alpha \u2192
audio/*.wav \u6309\u65F6\u95F4\u52A0\u5230\u89C6\u9891\u5E8F\u5217\u7F16\u8F91\u5668\uFF08\u9010\u4E8B\u4EF6\u97F3\u6548 + \u9759\u97F3\u7684\u6DF7\u5408\u97F3\u8F68\uFF09\u2192 \u53EF\u9009\u5BFC\u51FA scene.fbx\uFF08\u7ED9 C4D / UE5\uFF09\u3002
"""
import bpy, json, os, sys, math, struct, re

HERE = os.path.dirname(os.path.abspath(__file__)) if "__file__" in globals() and __file__ else os.getcwd()
argv = sys.argv[sys.argv.index("--") + 1:] if "--" in sys.argv else []
def arg(name, default=None):
    if name in argv:
        i = argv.index(name)
        return argv[i + 1] if i + 1 < len(argv) and not argv[i + 1].startswith("--") else True
    return default
DIR = arg("--dir", HERE)
OUT = arg("--out", DIR)
DO_FBX = bool(arg("--fbx", False))
DO_SAVE = bool(arg("--save", False))
ENGINE = arg("--engine", "EEVEE")
RENDER = arg("--render", None)
VERIFY = bool(arg("--verify", False))

meta = json.load(open(os.path.join(DIR, "scene3d.json"), encoding="utf-8"))
glb_path = os.path.join(DIR, "scene.glb")

def read_gltf_json(path):
    with open(path, "rb") as f:
        data = f.read()
    n = struct.unpack_from("<I", data, 12)[0]
    return json.loads(data[20:20 + n].decode("utf-8"))
G = read_gltf_json(glb_path)
GMAT = {m.get("name"): m for m in G.get("materials", [])}

scene = bpy.context.scene
# \u6E05\u7A7A\u9ED8\u8BA4\u573A\u666F
for o in list(bpy.data.objects):
    bpy.data.objects.remove(o, do_unlink=True)
fps = int(meta["fps"])
scene.render.fps = fps          # \u5BFC\u5165\u524D\u8BBE\u7F6E\uFF1AglTF \u5BFC\u5165\u5668\u6309\u573A\u666F\u5E27\u7387\u628A\u79D2\u6362\u7B97\u6210\u5E27
scene.render.fps_base = 1.0
bpy.ops.import_scene.gltf(filepath=glb_path)

# \u5173\u952E\u5E27\u8303\u56F4 \u2192 \u5E27\u504F\u79FB\uFF08\u5BFC\u5165\u5668\u4E00\u822C\u4ECE\u7B2C 0 \u5E27\u5F00\u59CB\uFF09
def action_range():
    lo, hi = 1e9, -1e9
    for a in bpy.data.actions:
        r = a.frame_range
        lo, hi = min(lo, r[0]), max(hi, r[1])
    return lo, hi
lo, hi = action_range()
OFF = int(round(lo)) if lo < 1e8 else 0
scene.frame_start = OFF
scene.frame_end = OFF + int(meta["frameEnd"])
scene.frame_set(OFF)

# \u76F8\u673A
cam = bpy.data.objects.get(meta["camera"]["name"])
if cam is None:
    cam = next((o for o in bpy.data.objects if o.type == "CAMERA"), None)
if cam:
    scene.camera = cam
    C = meta["camera"]
    if C.get("type") == "perspective":  # v1.2\uFF1A\u4E0E\u9875\u9762 3D \u6E32\u67D3\u540C\u4E00\u900F\u89C6\u76F8\u673A\uFF08FOV / \u4FEF\u89D2 / \u8DDD\u79BB\uFF09
        cam.data.type = "PERSP"
        cam.data.sensor_fit = "VERTICAL"
        cam.data.angle_y = math.radians(C["yfov"])
        cam.data.clip_start, cam.data.clip_end = C.get("near", 0.05), C.get("far", 40)
    else:
        cam.data.type = "ORTHO"
        cam.data.ortho_scale = C["orthoScale"]
        cam.data.sensor_fit = "AUTO"
        cam.data.clip_start, cam.data.clip_end = 0.01, 50
# \u706F\u5149\uFF1Athree.js \u7269\u7406\u5149\u7167 \u2192 Blender\uFF08\u592A\u9633\u5F3A\u5EA6 = \u7167\u5EA6\uFF1B\u534A\u7403\u73AF\u5883\u5149 \u2192 \u4E16\u754C\u80CC\u666F = \u5F3A\u5EA6/\u03C0 \xD7 \u5929\u7A7A/\u5730\u9762\u8272\u52A0\u6743\uFF09
LI = meta.get("lights")
def hex_lin(h):
    v = [int(h[i:i + 2], 16) / 255 for i in (1, 3, 5)]
    return [c / 12.92 if c <= 0.04045 else ((c + 0.055) / 1.055) ** 2.4 for c in v]
scene.render.resolution_x = int(meta["width"])
scene.render.resolution_y = int(meta["height"])
scene.render.resolution_percentage = 100

# \u8272\u5F69\uFF1AStandard\uFF08\u4E0D\u8981 AgX/Filmic\uFF0C\u5426\u5219\u989C\u8272\u4F1A\u548C\u7F51\u9875\u4E0D\u540C\uFF09
scene.view_settings.view_transform = "Standard"
scene.view_settings.look = "None"
scene.view_settings.exposure = 0
scene.view_settings.gamma = 1
if scene.world is None:
    scene.world = bpy.data.worlds.new("World")
scene.world.use_nodes = True
bg = scene.world.node_tree.nodes.get("Background")
if bg:
    bg.inputs[0].default_value = (0, 0, 0, 1)
    bg.inputs[1].default_value = 0
    if LI:
        sky, gnd = hex_lin(LI["ambient"]["sky"]), hex_lin(LI["ambient"]["ground"])
        col = [0.7 * a + 0.3 * b for a, b in zip(sky, gnd)]
        bg.inputs[0].default_value = (col[0], col[1], col[2], 1)
        bg.inputs[1].default_value = LI["ambient"]["intensity"] / math.pi
if LI:
    for o in bpy.data.objects:
        if o.type == "LIGHT" and o.data.type == "SUN":
            o.data.energy = LI["sun"]["intensity"]
            o.data.angle = math.radians(8)

# \u6750\u8D28\uFF1A\u81EA\u53D1\u5149 + \u900F\u660E\uFF08\u5E73\u9762\u65E0\u5149\u7167\uFF0C\u4E0E\u7F51\u9875\u4E00\u81F4\uFF09
def first_image(mat):
    if not mat.use_nodes:
        return None
    for n in mat.node_tree.nodes:
        if n.type == "TEX_IMAGE" and n.image:
            return n.image
    return None
INFO = {}
def info(mat):
    if mat.name not in INFO:
        g = GMAT.get(mat.name, {})
        INFO[mat.name] = (g.get("pbrMetallicRoughness", {}).get("baseColorFactor", [1, 1, 1, 1]), g.get("alphaMode", "OPAQUE"), g.get("alphaCutoff", 0.5), first_image(mat))
    return INFO[mat.name]
def principled(mat):
    """FBX \u7528\uFF1APrincipled BSDF\uFF08\u5E95\u8272=\u8D34\u56FE\xD7\u989C\u8272\uFF0C\u81EA\u53D1\u5149=\u540C\u4E00\u8D34\u56FE\uFF0CAlpha=\u8D34\u56FE Alpha\xD7\u4E0D\u900F\u660E\u5EA6\uFF09\uFF0CFBX \u5BFC\u51FA\u5668\u53EA\u8BA4\u8FD9\u79CD\u7ED3\u6784"""
    fac, mode, cutoff, img = info(mat)
    mat.use_nodes = True
    nt = mat.node_tree; nt.nodes.clear(); N, L = nt.nodes, nt.links
    out = N.new("ShaderNodeOutputMaterial"); out.location = (600, 0)
    b = N.new("ShaderNodeBsdfPrincipled"); b.location = (250, 0)
    b.inputs["Base Color"].default_value = (fac[0], fac[1], fac[2], 1)
    b.inputs["Alpha"].default_value = fac[3]
    b.inputs["Roughness"].default_value = 1.0
    b.inputs["Emission Strength"].default_value = 1.0
    b.inputs["Emission Color"].default_value = (fac[0], fac[1], fac[2], 1)
    if img:
        tex = N.new("ShaderNodeTexImage"); tex.image = img; tex.location = (-200, 0)
        L.new(tex.outputs[0], b.inputs["Base Color"]); L.new(tex.outputs[0], b.inputs["Emission Color"])
        if mode != "OPAQUE":
            L.new(tex.outputs[1], b.inputs["Alpha"])
    L.new(b.outputs[0], out.inputs[0])
def rebuild(mat):
    fac, mode, cutoff, img = info(mat)
    mat.use_nodes = True
    nt = mat.node_tree; nt.nodes.clear(); N, L = nt.nodes, nt.links
    out = N.new("ShaderNodeOutputMaterial"); out.location = (900, 0)
    em = N.new("ShaderNodeEmission"); em.location = (500, 100)
    tr = N.new("ShaderNodeBsdfTransparent"); tr.location = (500, -100)
    mix = N.new("ShaderNodeMixShader"); mix.location = (700, 0)
    col = N.new("ShaderNodeRGB"); col.location = (-200, 200); col.outputs[0].default_value = (fac[0], fac[1], fac[2], 1)
    col.label = "baseColorFactor"
    mul = N.new("ShaderNodeMix"); mul.data_type = "RGBA"; mul.blend_type = "MULTIPLY"; mul.location = (100, 150)
    mul.inputs[0].default_value = 1.0
    L.new(col.outputs[0], mul.inputs[6])
    alpha_val = N.new("ShaderNodeValue"); alpha_val.name = alpha_val.label = "Opacity"; alpha_val.location = (-200, -250)
    alpha_val.outputs[0].default_value = fac[3]
    alpha = alpha_val.outputs[0]
    if img:
        tex = N.new("ShaderNodeTexImage"); tex.image = img; tex.location = (-450, 50); tex.interpolation = "Linear"
        tex.extension = "CLIP"
        L.new(tex.outputs[0], mul.inputs[7])
        am = N.new("ShaderNodeMath"); am.operation = "MULTIPLY"; am.location = (100, -200)
        L.new(tex.outputs[1], am.inputs[0]); L.new(alpha_val.outputs[0], am.inputs[1]); alpha = am.outputs[0]
        if mat.name.startswith("mat_end"):  # \u7ED3\u675F\u9875\u538B\u6697\u5C42\uFF1A\u7F51\u9875\u5728 sRGB \u7A7A\u95F4\u6DF7\u5408 \u2192 \u7EBF\u6027\u7A7A\u95F4\u7B49\u6548 alpha' = 1-(1-a)^2.2
            s1 = N.new("ShaderNodeMath"); s1.operation = "SUBTRACT"; s1.inputs[0].default_value = 1.0; L.new(alpha, s1.inputs[1])
            pw = N.new("ShaderNodeMath"); pw.operation = "POWER"; L.new(s1.outputs[0], pw.inputs[0]); pw.inputs[1].default_value = 2.2
            s2 = N.new("ShaderNodeMath"); s2.operation = "SUBTRACT"; s2.inputs[0].default_value = 1.0; L.new(pw.outputs[0], s2.inputs[1]); alpha = s2.outputs[0]
    else:
        mul.inputs[7].default_value = (1, 1, 1, 1)
    c = mul.outputs[2]
    if False:  # \u724C\u8EAB\u7528\u9876\u70B9\u8272\uFF08\u767D\u2192\u7070\u2192\u7EFF \u6E10\u53D8\uFF09
        vc = N.new("ShaderNodeVertexColor"); vc.location = (100, 400)
        m2 = N.new("ShaderNodeMix"); m2.data_type = "RGBA"; m2.blend_type = "MULTIPLY"; m2.location = (300, 250); m2.inputs[0].default_value = 1
        L.new(c, m2.inputs[6]); L.new(vc.outputs[0], m2.inputs[7]); c = m2.outputs[2]
    L.new(c, em.inputs[0]); em.inputs[1].default_value = 1.0
    if mode == "MASK":
        st = N.new("ShaderNodeMath"); st.operation = "GREATER_THAN"; st.inputs[1].default_value = cutoff - 1e-4; st.location = (300, -250)
        L.new(alpha, st.inputs[0]); alpha = st.outputs[0]
    if mode == "OPAQUE":
        L.new(em.outputs[0], out.inputs[0])
    else:
        L.new(alpha, mix.inputs[0]); L.new(tr.outputs[0], mix.inputs[1]); L.new(em.outputs[0], mix.inputs[2]); L.new(mix.outputs[0], out.inputs[0])
    try:
        mat.surface_render_method = "BLENDED" if mode == "BLEND" else "DITHERED"
    except Exception:
        mat.blend_method = "BLEND" if mode == "BLEND" else ("CLIP" if mode == "MASK" else "OPAQUE")
    return alpha_val

# \u6DE1\u5165\u6DE1\u51FA\uFF1Ascene3d.json \u7684 opacity \u66F2\u7EBF \u2192 \u6750\u8D28 Opacity \u503C\u5173\u952E\u5E27
# \u97F3\u9891\uFF1A\u9010\u4E8B\u4EF6\u97F3\u6548 + \u6DF7\u5408\u97F3\u8F68\uFF08\u9759\u97F3\uFF0C\u9700\u8981\u65F6\u53EF\u6539\u4E3A\u53D6\u6D88\u9759\u97F3\u5E76\u9759\u97F3\u9010\u4E8B\u4EF6\u8F68\uFF09
seq = scene.sequence_editor_create()
n_snd = 0
if meta.get("mix"):
    p = os.path.join(DIR, meta["mix"]["file"])
    if os.path.exists(p):
        s = seq.sequences.new_sound("mix", p, 1, OFF); s.mute = True; n_snd += 1
for i, e in enumerate(meta.get("audio", [])):
    p = os.path.join(DIR, e["file"])
    if not os.path.exists(p):
        continue
    s = seq.sequences.new_sound("sfx_%03d" % (i + 1), p, 2 + (i % 6), OFF + int(round(e["t"] * fps)))
    s.volume = 10 ** (e.get("db", 0) / 20.0)
    n_snd += 1
try:
    scene.render.ffmpeg.audio_codec = "AAC"
except Exception:
    pass

# \u6E32\u67D3\u8BBE\u7F6E
if ENGINE.upper().startswith("CYCLES"):
    scene.render.engine = "CYCLES"
    scene.cycles.device = "CPU"
    scene.cycles.samples = int(arg("--samples", 16))
    scene.cycles.use_denoising = False
    scene.cycles.max_bounces = 0
    scene.cycles.transparent_max_bounces = 64
else:
    for e in ("BLENDER_EEVEE_NEXT", "BLENDER_EEVEE"):
        try:
            scene.render.engine = e; break
        except Exception:
            pass
scene.render.film_transparent = False

report = {"objects": len(bpy.data.objects), "meshes": sum(1 for o in bpy.data.objects if o.type == "MESH"),
          "empties": sum(1 for o in bpy.data.objects if o.type == "EMPTY"), "cameras": sum(1 for o in bpy.data.objects if o.type == "CAMERA"),
          "actions": len(bpy.data.actions), "fcurves": sum(len(a.fcurves) for a in bpy.data.actions),
          "keyframes": sum(len(fc.keyframe_points) for a in bpy.data.actions for fc in a.fcurves),
          "frame_range": [scene.frame_start, scene.frame_end], "action_range": [lo, hi], "offset": OFF, "fps": fps,
          "sound_strips": n_snd,
          "lights": sum(1 for o in bpy.data.objects if o.type == "LIGHT"),
          "tiles": sum(1 for o in bpy.data.objects if re.match(r"^tile_\\d+(_s\\d+)?$", o.name)),
          "cups": sum(1 for o in bpy.data.objects if re.match(r"^cup_\\d+(_s\\d+)?$", o.name)),
          "boxes": sum(1 for o in bpy.data.objects if re.match(r"^box_", o.name) and not o.name.endswith(("_vis", "_q"))),
          "camera": scene.camera.name if scene.camera else None, "resolution": [scene.render.resolution_x, scene.render.resolution_y]}

os.makedirs(OUT, exist_ok=True)
MATS = [m for m in bpy.data.materials if m.users and (m.name.startswith("mat_") or not LI)]  # v1.2\uFF1A\u53EA\u628A 2D \u53E0\u52A0\u5C42\uFF08mat_*\uFF09\u6539\u4E3A\u81EA\u53D1\u5149\uFF1B3D \u6A21\u578B\uFF08pbr_*\uFF09\u4FDD\u7559 PBR
for m in MATS:
    info(m)
if DO_FBX:
    for m in MATS:
        principled(m)
    fbx = os.path.join(OUT, "scene.fbx")
    bpy.ops.export_scene.fbx(filepath=fbx, use_selection=False, object_types={"MESH", "CAMERA", "EMPTY", "LIGHT"},
                             bake_anim=True, bake_anim_use_all_bones=False, bake_anim_use_nla_strips=False, bake_anim_use_all_actions=False,
                             bake_anim_force_startend_keying=True, bake_anim_step=1.0, bake_anim_simplify_factor=1.0,
                             path_mode="COPY", embed_textures=True, axis_forward="-Z", axis_up="Y", apply_unit_scale=True, add_leaf_bones=False, colors_type="SRGB")
    report["fbx"] = fbx
    report["fbx_size"] = os.path.getsize(fbx)
# Blender \u5185\u6E32\u67D3\u7528\uFF1A\u81EA\u53D1\u5149 + \u900F\u660E\u6750\u8D28\uFF08FBX \u5DF2\u5BFC\u51FA\uFF0C\u4E0D\u53D7\u5F71\u54CD\uFF09
opacity_node = {}
for m in MATS:
    opacity_node[m.name] = rebuild(m)
report["materials"] = len(opacity_node)
# \u7F51\u9875\u5728 sRGB \u7A7A\u95F4\u6DF7\u5408\uFF0CBlender \u5728\u7EBF\u6027\u7A7A\u95F4\u6DF7\u5408\uFF1A\u7EAF\u9ED1\u538B\u6697\u5C42\uFF08\u5F00\u573A\u538B\u6697\uFF09\u6309 sRGB \u7B49\u6548\u6362\u7B97\uFF0C\u4F7F\u53D8\u6697\u7A0B\u5EA6\u4E00\u81F4
def srgb_to_lin(c):
    return c / 12.92 if c <= 0.04045 else ((c + 0.055) / 1.055) ** 2.4
KIND = {n["name"]: n.get("kind") for n in meta.get("nodes", [])}
n_op = 0
for name, keys in meta.get("opacity", {}).items():
    if KIND.get(name) == "solid":
        keys = [[t, 1 - srgb_to_lin(1 - a)] for t, a in keys]
    o = bpy.data.objects.get(name)
    if not o or not o.active_material:
        continue
    v = opacity_node.get(o.active_material.name)
    if not v:
        continue
    for t, a in keys:
        v.outputs[0].default_value = a
        v.outputs[0].keyframe_insert("default_value", frame=OFF + t * fps)
    n_op += 1

report["opacity_curves"] = n_op
# glTF/FBX \u91CC\u6DE1\u5165\u6DE1\u51FA\u5143\u7D20\u6309\u9608\u503C\u663E\u793A/\u9690\u85CF\uFF1B\u5728 Blender \u91CC\u5DF2\u6709\u7CBE\u786E\u7684\u6750\u8D28 Opacity \u66F2\u7EBF\uFF0C
# \u6240\u4EE5\u628A\u8FD9\u4E9B\u5143\u7D20\u5916\u5C42 *_vis \u7684\u663E\u793A\u533A\u95F4\u6539\u4E3A\u5B8C\u6574\u7684\u5165\u70B9..\u51FA\u70B9\uFF08FBX \u5DF2\u5728\u4E0A\u9762\u5BFC\u51FA\uFF0C\u4E0D\u53D7\u5F71\u54CD\uFF09
NODE = {n["name"]: n for n in meta.get("nodes", [])}
n_vis = 0
for name in meta.get("opacity", {}):
    o = bpy.data.objects.get(name); n = NODE.get(name)
    if not o or not n or not o.parent or "in" not in n:
        continue
    p = o.parent
    while p and not p.name.endswith("_vis"):  # v1.2\uFF1A_vis \u2192 \u8282\u70B9(\u4F4D\u7F6E/\u7F29\u653E\u52A8\u753B) \u2192 _q \u8D34\u7247
        p = p.parent
    if not p:
        continue
    ad = p.animation_data
    if ad and ad.action:
        for fc in [fc for fc in ad.action.fcurves if fc.data_path == "scale"]:
            ad.action.fcurves.remove(fc)
    for fr, v in ((OFF, 1.0 if n["in"] <= 0 else 0.0), (OFF + n["in"] * fps, 1.0), (OFF + n["out"] * fps, 0.0)):
        p.scale = (v, v, v)
        p.keyframe_insert("scale", frame=fr)
    for fc in p.animation_data.action.fcurves:
        if fc.data_path == "scale":
            for kp in fc.keyframe_points:
                kp.interpolation = "CONSTANT"
    n_vis += 1
report["vis_overrides"] = n_vis
if RENDER:
    os.makedirs(OUT, exist_ok=True)
    report["renders"] = []
    for tok in str(RENDER).split(","):
        tsec = float(tok[:-1]) if tok.endswith("s") else None
        fr = OFF + tsec * fps if tsec is not None else OFF + float(tok)
        fi = int(math.floor(fr)); sub = fr - fi
        scene.frame_set(fi, subframe=sub)
        scene.render.filepath = os.path.join(OUT, "render_%s.png" % tok.replace(".", "_"))
        bpy.ops.render.render(write_still=True)
        report["renders"].append(scene.render.filepath)
if DO_SAVE:
